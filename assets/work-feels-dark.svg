<svg xmlns="http://www.w3.org/2000/svg" width="896" height="92" viewBox="0 0 896 92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" role="img" aria-label="Feels — Dating app. Mobile, Backend.">
<title>Feels — Dating app. Mobile, Backend.</title>
<style>
.draw{stroke-dasharray:1;animation:d 2.2s cubic-bezier(.5,.05,.2,1) .15s both}
.fill{animation:f 1s ease 1.6s both}
.late{animation:f .4s ease 2.2s both}
.toast{animation:t .7s cubic-bezier(.2,.8,.2,1) 2.4s both}
.live{animation:b 1.6s ease-in-out infinite}
@keyframes d{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes f{from{opacity:0}to{opacity:1}}
@keyframes t{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes b{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){
 .draw,.fill,.late,.toast,.live{animation:none}.sc{display:none}
}</style>
